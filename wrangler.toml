name = "buildbyte-coming-soon"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# ─────────────────────────────────────────────────────────────
# D1 database binding — create with:
#   wrangler d1 create buildbyte
# then paste the database_id below.
# ─────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "buildbyte"
database_id = "5f52cb04-84b5-46ba-93eb-f88ef7d0a0d5"

# ─────────────────────────────────────────────────────────────
# R2 bucket binding (optional — used for storing screenshots /
# generated site previews). Create with:
#   wrangler r2 bucket create buildbyte-assets
# ─────────────────────────────────────────────────────────────
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "buildbyte-assets"

# ─────────────────────────────────────────────────────────────
# Admin password for /db dashboard.
# The default below is the SHA-256 hash of "uf1" (salted).
# To rotate: echo -n "yoursecret" | shasum -a 256
# Then set as a secret:  wrangler pages secret put ADMIN_PASS_HASH
# ─────────────────────────────────────────────────────────────
[vars]
# SHA-256 of "uf1" — change via  wrangler pages secret put ADMIN_PASS_HASH
ADMIN_PASS_HASH = "12f446ec9bf982f1b89e56efd36bef16215139294afb89345125aa11e0a30487"

# Launch date — January 13 of the configured year (UTC).
LAUNCH_DATE_ISO = "2026-01-13T00:00:00Z"
